<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sys Info</title>
<style>
  :root{ --bg:#16181d; --card:#1f232a; --accent:#4fd1c5; --text:#e8ebf0; --sub:#8992a3; --border:#2c313a; }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,Roboto,"Segoe UI",sans-serif;font-size:14px;}
  header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:19px;margin:0;color:var(--accent);letter-spacing:.3px;}
  header .status{font-size:11px;color:var(--sub);}
  header button{background:var(--card);border:1px solid var(--border);color:var(--accent);
    border-radius:8px;padding:8px 12px;font-size:13px;}

  nav{display:flex;overflow-x:auto;gap:4px;padding:0 12px 10px;border-bottom:1px solid var(--border);}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto;background:none;color:var(--sub);border:none;
    padding:8px 10px;font-size:13px;font-weight:600;border-bottom:2px solid transparent;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}

  main{padding:12px 12px 30px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px;margin-bottom:10px;}
  .card .title{font-size:12px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}

  .freq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;}
  .freq-grid .core{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);}
  .freq-grid .core b{color:var(--text);font-weight:600;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .big-row{display:flex;align-items:center;gap:12px;}
  .big-row .num{font-size:26px;font-weight:700;}
  .big-row .lines{display:flex;flex-direction:column;gap:2px;}
  .big-row .lines div{font-size:12.5px;color:var(--sub);}
  .big-row .lines b{color:var(--text);}
  .ring-row{display:flex;align-items:center;gap:14px;}
  .ring-row .info div{font-size:12.5px;color:var(--sub);margin-bottom:2px;}
  .ring-row .info b{color:var(--text);font-size:13.5px;}

  .kv .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
  .kv .row:last-child{border-bottom:none;}
  .kv .row .k{color:var(--sub);}
  .kv .row .v{font-weight:600;text-align:right;word-break:break-word;}

  pre{white-space:pre-wrap;word-break:break-all;color:#b8c0cc;margin:0;
    font-size:11.5px;font-family:"SF Mono",Consolas,monospace;line-height:1.5;}

  .err{background:#ff6b6b22;border:1px solid #ff6b6b55;color:#ff9d9d;
    border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12.5px;}
  .muted{color:var(--sub);font-size:12.5px;padding:6px 0;}
</style>
</head>
<body>
<header>
  <div>
    <h1>Sys Info</h1>
    <div class="status" id="status">loading...</div>
  </div>
  <button onclick="refreshCurrent()">↻</button>
</header>
<nav id="tabs"></nav>
<main id="out"></main>

<script>
const TABS = [
  {id:'panel',    label:'Panel'},
  {id:'hardware', label:'Hardware'},
  {id:'system',   label:'System'},
  {id:'battery',  label:'Battery'},
  {id:'network',  label:'Network'},
  {id:'graphics', label:'Graphics'},
  {id:'disk',     label:'Disk'},
];
let currentTab = 'panel';
const TAB_DATA = {};

function esc(s){ return (s+'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function row(k,v){ return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${esc(v||'-')}</span></div>`; }
function ringSvg(pct, color){
  const r=30, c=2*Math.PI*r, off=c-(pct/100)*c;
  return `<svg width="72" height="72" viewBox="0 0 72 72">
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="#2c313a" stroke-width="8"/>
    <circle cx="36" cy="36" r="${r}" fill="none" stroke="${color}" stroke-width="8"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 36 36)"/>
    <text x="36" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="${color}">${pct}%</text>
  </svg>`;
}
function parseBlocks(stdout){
  const blocks = {}; let cur = null;
  stdout.split('\n').forEach(line=>{
    const m = line.match(/^==(.+)==$/);
    if(m){ cur = m[1]; blocks[cur] = []; }
    else if(cur !== null) blocks[cur].push(line);
  });
  return blocks;
}
function kvBlock(lines){
  const map = {};
  (lines||[]).forEach(l=>{
    const i = l.indexOf(':');
    if(i>-1) map[l.slice(0,i).trim()] = l.slice(i+1).trim();
  });
  return map;
}
function nonEmpty(lines){ return (lines||[]).filter(l=>l.trim()); }

const TAB_CMDS = {
  panel: `
echo ==DEVICE==
echo "Manufacturer: $(getprop ro.product.manufacturer)"
echo "Model: $(getprop ro.product.model)"
echo "Android: $(getprop ro.build.version.release)"
echo "SDK: $(getprop ro.build.version.sdk)"
echo "Security patch: $(getprop ro.build.version.security_patch)"
echo "Uptime: $(uptime)"
echo ==CPUFREQ==
for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq; do cat "$f" 2>/dev/null; echo; done
echo ==RAM==
grep -E "MemTotal|MemAvailable" /proc/meminfo
echo ==BATTERY==
dumpsys battery 2>/dev/null | grep -E "^\\s*(level|status|health|temperature):"
echo ==DISPLAY==
echo "Resolution: $(wm size | cut -d: -f2 | sed 's/^ *//')"
echo "Density: $(wm density | cut -d: -f2 | sed 's/^ *//')"
echo ==STORAGE==
df -h /data 2>/dev/null | tail -1
echo ==APPS==
echo "Total: $(pm list packages 2>/dev/null | wc -l)"
echo "User: $(pm list packages -3 2>/dev/null | wc -l)"
echo "System: $(pm list packages -s 2>/dev/null | wc -l)"
echo ==NET==
echo "Hostname: $(getprop net.hostname)"
echo "WiFi IP: $(ip -4 addr show wlan0 2>/dev/null | grep -oE "inet [0-9.]+" | cut -d' ' -f2)"
`,
  hardware: `
echo ==CPU==
echo "Hardware: $(grep -m1 Hardware /proc/cpuinfo | cut -d: -f2 | sed 's/^ *//')"
echo "Core count: $(nproc)"
echo "ABI: $(getprop ro.product.cpu.abi)"
echo "Supported ABIs: $(getprop ro.product.cpu.abilist)"
echo "Max frequency (core0): $(cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq 2>/dev/null)"
echo ==CPUFREQ==
for f in /sys/devices/system/cpu/cpu*/cpufreq/scaling_cur_freq; do cat "$f" 2>/dev/null; echo; done
echo ==GPU==
dumpsys SurfaceFlinger 2>/dev/null | grep -m1 "GLES:"
echo ==DISPLAY==
echo "Resolution: $(wm size | cut -d: -f2 | sed 's/^ *//')"
echo "Density: $(wm density | cut -d: -f2 | sed 's/^ *//')"
echo ==RAM==
grep -E "MemTotal|MemAvailable" /proc/meminfo
echo ==BOARD==
echo "Board: $(getprop ro.product.board)"
echo "Platform: $(getprop ro.board.platform)"
`,
  system: `
echo ==SYSTEM==
echo "Android: $(getprop ro.build.version.release)"
echo "SDK: $(getprop ro.build.version.sdk)"
echo "Build ID: $(getprop ro.build.id)"
echo "Security patch: $(getprop ro.build.version.security_patch)"
echo "Bootloader: $(getprop ro.bootloader)"
echo "Baseband: $(getprop gsm.version.baseband)"
echo "Kernel: $(uname -r)"
echo "Uptime: $(uptime)"
echo ==FINGERPRINT==
getprop ro.build.fingerprint
`,
  battery: `
echo ==BATTERY==
dumpsys battery 2>/dev/null
`,
  network: `
echo ==NET==
echo "Hostname: $(getprop net.hostname)"
echo "WiFi IP: $(ip -4 addr show wlan0 2>/dev/null | grep -oE "inet [0-9.]+" | cut -d' ' -f2)"
echo ==IFACES==
ip -o link show 2>/dev/null | awk -F': ' '{print $2}'
echo ==WIFI==
dumpsys wifi 2>/dev/null | grep -m8 -E "SSID|RSSI|Link speed|frequency|Supplicant state"
true
`,
  graphics: `
echo ==OPENGL==
dumpsys SurfaceFlinger 2>/dev/null | grep -A1 -m1 "GLES:"
echo ==VULKAN_FEATURES==
pm list features 2>/dev/null | grep -i vulkan
echo ==VULKAN_LIBS==
ls /vendor/lib64/hw/ 2>/dev/null | grep -i vulkan
ls /system/lib64/hw/ 2>/dev/null | grep -i vulkan
true
`,
  disk: `
echo ==MOUNTS==
df -h 2>/dev/null
echo ==PARTITIONS==
cat /proc/partitions 2>/dev/null
`
};

function renderPanel(b){
  const dev = kvBlock(b['DEVICE']);
  const bat = kvBlock(b['BATTERY']);
  const disp = kvBlock(b['DISPLAY']);
  const app = kvBlock(b['APPS']);
  const net = kvBlock(b['NET']);
  const ram = kvBlock(b['RAM']);
  const storLine = (b['STORAGE']||[])[0] || '';
  const cores = nonEmpty(b['CPUFREQ']).map(l=>parseInt(l.trim(),10)).filter(n=>!isNaN(n));

  const totalKb = parseInt((ram['MemTotal']||'0').replace(/\D/g,''),10);
  const availKb = parseInt((ram['MemAvailable']||'0').replace(/\D/g,''),10);
  const ramPct = totalKb ? Math.round(100*(totalKb-availKb)/totalKb) : 0;
  const ramUsedGb = ((totalKb-availKb)/1048576).toFixed(2);
  const ramTotalGb = (totalKb/1048576).toFixed(2);

  const sp = storLine.trim().split(/\s+/);
  const storPct = sp[4] ? parseInt(sp[4],10) : 0;

  const battLevel = parseInt(bat['level'],10) || 0;
  const battStatusMap = {1:'Unknown',2:'Charging',3:'Discharging',4:'Not charging',5:'Full'};
  const battHealthMap = {1:'Unknown',2:'Good',3:'Overheat',4:'Dead',5:'Over voltage',6:'Failure',7:'Cold'};
  const battTemp = bat['temperature'] ? (parseInt(bat['temperature'],10)/10).toFixed(1)+'°C' : '-';

  let html = '';
  if(cores.length){
    html += `<div class="card"><div class="title">CPU Frequency</div><div class="freq-grid">
      ${cores.map((mhz,i)=>`<div class="core">Core ${i}<b>${mhz} MHz</b></div>`).join('')}
    </div></div>`;
  }
  html += `<div class="two-col">
    <div class="card"><div class="title">Battery</div>
      <div class="big-row"><div class="num" style="color:var(--accent)">${battLevel}%</div>
        <div class="lines"><div><b>${battTemp}</b></div>
          <div>${esc(battStatusMap[bat['status']]||bat['status']||'-')}</div>
          <div>${esc(battHealthMap[bat['health']]||bat['health']||'-')}</div></div>
      </div></div>
    <div class="card"><div class="title">Network</div><div class="lines">
        <div>IP: <b>${esc(net['WiFi IP']||'not connected')}</b></div>
        <div>Host: <b>${esc(net['Hostname']||'-')}</b></div>
      </div></div>
  </div>`;
  html += `<div class="two-col">
    <div class="card"><div class="title">Apps</div>
      <div class="big-row"><div class="num">${esc(app['Total']||'-')}</div>
        <div class="lines"><div>Total</div>
          <div><b>${esc(app['User']||'-')}</b> user</div>
          <div><b>${esc(app['System']||'-')}</b> system</div></div>
      </div></div>
    <div class="card"><div class="title">Display</div><div class="lines">
        <div>Resolution: <b>${esc(disp['Resolution']||'-')}</b></div>
        <div>Density: <b>${esc(disp['Density']||'-')}</b> dpi</div>
      </div></div>
  </div>`;
  html += `<div class="two-col">
    <div class="card"><div class="title">RAM</div><div class="ring-row">${ringSvg(ramPct,'#4fd1c5')}
        <div class="info"><div><b>${ramUsedGb} GB</b> used</div><div>${ramTotalGb} GB total</div></div>
      </div></div>
    <div class="card"><div class="title">Storage</div><div class="ring-row">${ringSvg(isNaN(storPct)?0:storPct,'#f0b429')}
        <div class="info"><div><b>${esc(sp[2]||'-')}</b> used</div><div>${esc(sp[1]||'-')} total</div></div>
      </div></div>
  </div>`;
  html += `<div class="card"><div class="title">Device</div><div class="kv">
    ${row('Manufacturer', dev['Manufacturer'])}${row('Model', dev['Model'])}
    ${row('Android', dev['Android'])}${row('SDK', dev['SDK'])}
    ${row('Security patch', dev['Security patch'])}${row('Uptime', dev['Uptime'])}
  </div></div>`;
  return html;
}

function renderHardware(b){
  const cpu = kvBlock(b['CPU']);
  const board = kvBlock(b['BOARD']);
  const disp = kvBlock(b['DISPLAY']);
  const ram = kvBlock(b['RAM']);
  const gpuLine = (b['GPU']||[])[0] || '';
  const gpuParts = gpuLine.replace(/^GLES:\s*/,'').split(',').map(s=>s.trim());
  const cores = nonEmpty(b['CPUFREQ']).map(l=>parseInt(l.trim(),10)).filter(n=>!isNaN(n));
  const totalKb = parseInt((ram['MemTotal']||'0').replace(/\D/g,''),10);

  let html = `<div class="card"><div class="title">CPU</div><div class="kv">
    ${row('Hardware', cpu['Hardware'])}
    ${row('Core count', cpu['Core count'])}
    ${row('ABI', cpu['ABI'])}
    ${row('Supported ABIs', cpu['Supported ABIs'])}
    ${row('Max frequency', cpu['Max frequency (core0)'] ? Math.round(cpu['Max frequency (core0)']/1000)+' MHz' : '-')}
  </div></div>`;

  if(cores.length){
    html += `<div class="card"><div class="title">Core Frequencies</div><div class="freq-grid">
      ${cores.map((mhz,i)=>`<div class="core">Core ${i}<b>${mhz} MHz</b></div>`).join('')}
    </div></div>`;
  }

  html += `<div class="card"><div class="title">GPU / Display</div><div class="kv">
    ${row('GPU vendor', gpuParts[0])}
    ${row('GPU renderer', gpuParts[1])}
    ${row('OpenGL ES', gpuParts[2])}
    ${row('Resolution', disp['Resolution'])}
    ${row('Density', (disp['Density']||'')+' dpi')}
  </div></div>`;

  html += `<div class="card"><div class="title">Board / RAM</div><div class="kv">
    ${row('Board', board['Board'])}
    ${row('Platform', board['Platform'])}
    ${row('Total RAM', totalKb ? (totalKb/1048576).toFixed(2)+' GB' : '-')}
  </div></div>`;
  return html;
}

function renderSystem(b){
  const s = kvBlock(b['SYSTEM']);
  const fp = nonEmpty(b['FINGERPRINT']).join('\n');
  return `<div class="card"><div class="title">System</div><div class="kv">
      ${row('Android', s['Android'])}${row('SDK', s['SDK'])}
      ${row('Build ID', s['Build ID'])}${row('Security patch', s['Security patch'])}
      ${row('Bootloader', s['Bootloader'])}${row('Baseband', s['Baseband'])}
      ${row('Kernel', s['Kernel'])}${row('Uptime', s['Uptime'])}
    </div></div>
    <div class="card"><div class="title">Fingerprint</div><pre>${esc(fp||'-')}</pre></div>`;
}

function renderBattery(b){
  const lines = nonEmpty(b['BATTERY']);
  if(!lines.length) return `<div class="muted">Could not read battery info.</div>`;
  const rows = lines.map(l=>{
    const t = l.trim();
    const i = t.indexOf(':');
    if(i===-1) return '';
    return row(t.slice(0,i).trim(), t.slice(i+1).trim());
  }).join('');
  return `<div class="card"><div class="title">Battery (dumpsys battery)</div><div class="kv">${rows}</div></div>`;
}

function renderNetwork(b){
  const net = kvBlock(b['NET']);
  const ifaces = nonEmpty(b['IFACES']);
  const wifi = nonEmpty(b['WIFI']);
  let html = `<div class="card"><div class="title">Network</div><div class="kv">
    ${row('Hostname', net['Hostname'])}${row('WiFi IP', net['WiFi IP'])}
  </div></div>`;
  html += `<div class="card"><div class="title">Interfaces</div>` +
    (ifaces.length ? `<div class="kv">${ifaces.map(i=>row(i.replace('@NONE',''),'')).join('')}</div>`
                   : `<div class="muted">No interfaces found</div>`) + `</div>`;
  html += `<div class="card"><div class="title">WiFi (dumpsys)</div>` +
    (wifi.length ? `<pre>${esc(wifi.join('\n'))}</pre>` : `<div class="muted">Could not read WiFi details (Full access mode may be required)</div>`) + `</div>`;
  return html;
}

function renderGraphics(b){
  const gl = nonEmpty(b['OPENGL']);
  const vkFeat = nonEmpty(b['VULKAN_FEATURES']);
  const vkLibs = nonEmpty(b['VULKAN_LIBS']);

  let html = `<div class="card"><div class="title">OpenGL ES</div>`;
  if(gl.length){
    const line = gl[0].replace(/^GLES:\s*/,'');
    const parts = line.split(',').map(s=>s.trim());
    html += `<div class="kv">${row('Vendor', parts[0])}${row('Renderer', parts[1])}${row('Version', parts[2])}</div>`;
    if(gl[1]) html += `<pre>${esc(gl[1])}</pre>`;
  } else {
    html += `<div class="muted">OpenGL info could not be detected.</div>`;
  }
  html += `</div>`;

  html += `<div class="card"><div class="title">Vulkan</div>`;
  if(vkFeat.length){
    html += `<div class="kv">${vkFeat.map(l=>{
      const t = l.trim().replace(/^feature:/,'');
      const i = t.indexOf('=');
      return i>-1 ? row(t.slice(0,i), t.slice(i+1)) : row(t,'');
    }).join('')}</div>`;
  } else {
    html += `<div class="muted">This device doesn't report a Vulkan feature flag, or it couldn't be detected.</div>`;
  }
  if(vkLibs.length){
    html += `<div class="kv" style="margin-top:8px;">${vkLibs.map(l=>row('Driver', l.trim())).join('')}</div>`;
  }
  html += `<div class="muted" style="margin-top:6px;">Note: most stock Android builds don't ship a full Vulkan extension dump tool (vulkaninfo), so only the feature flags / driver files the system reports are shown here.</div>`;
  html += `</div>`;
  return html;
}

function renderDisk(b){
  const mounts = nonEmpty(b['MOUNTS']);
  const parts = nonEmpty(b['PARTITIONS']);
  let html = `<div class="card"><div class="title">Mounted Volumes (df -h)</div>`;
  const dataRows = mounts.filter(l=>!/^Filesystem/.test(l.trim()));
  if(dataRows.length){
    html += `<div class="kv">${dataRows.map(l=>{
      const p = l.trim().split(/\s+/);
      if(p.length<6) return '';
      const mount = p.slice(5).join(' ');
      return row(mount, `${p[3]} free / ${p[1]}`);
    }).join('')}</div>`;
  } else {
    html += `<div class="muted">No data available</div>`;
  }
  html += `</div>`;
  html += `<div class="card"><div class="title">/proc/partitions (raw)</div>` +
    (parts.length ? `<pre>${esc(parts.join('\n'))}</pre>` : `<div class="muted">No data available</div>`) + `</div>`;
  return html;
}

const RENDERERS = {
  panel: renderPanel, hardware: renderHardware, system: renderSystem,
  battery: renderBattery, network: renderNetwork, graphics: renderGraphics, disk: renderDisk
};

function runTabCmd(id){
  const out = document.getElementById('out');
  const statusEl = document.getElementById('status');
  out.innerHTML = `<div class="muted">loading...</div>`;

  if(typeof window.Shizuku === 'undefined'){
    out.innerHTML = `<div class="err">window.Shizuku not found. Make sure the module is enabled and access mode is set to Full.</div>`;
    statusEl.textContent = 'not connected';
    return;
  }
  let result;
  try{ result = JSON.parse(window.Shizuku.exec(TAB_CMDS[id])); }
  catch(e){ out.innerHTML = `<div class="err">exec error: ${esc(e)}</div>`; return; }
  if(!result.ok){
    out.innerHTML = `<div class="err">${esc(result.stderr || 'command failed')}</div>`;
    return;
  }
  statusEl.textContent = 'connected — updated just now';
  TAB_DATA[id] = parseBlocks(result.stdout || '');
  renderCurrent();
}

function renderCurrent(){
  try{ document.getElementById('out').innerHTML = RENDERERS[currentTab](TAB_DATA[currentTab] || {}); }
  catch(e){ document.getElementById('out').innerHTML = `<div class="err">Error: ${esc(e)}</div>`; }
}

function ensureTab(id){
  if(TAB_DATA[id]){ renderCurrent(); return; }
  runTabCmd(id);
}
function refreshCurrent(){ runTabCmd(currentTab); }

function initTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(t=>`<button data-id="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentTab = btn.dataset.id;
      nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===btn));
      ensureTab(currentTab);
    });
  });
  nav.querySelector('button').classList.add('active');
}

initTabs();
runTabCmd('panel');
</script>
</body>
</html>
